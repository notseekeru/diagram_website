# Trivy ignore policy (v0.56+ / .trivyignore.yaml)
#
# Empty by design: the prod image strips the base image's bundled global
# npm + corepack (never invoked at runtime — the image boots `node` directly),
# which removes the brace-expansion / ip-address / node-tar CVEs they carried.
# The remaining OS + app/node_modules layers scan 0 HIGH/CRITICAL today.
#
# Dated, scoped exceptions with reachability rationale live here. When
# `expired_at` passes, the CD/`make prod-scan` gate re-fails until each is
# re-verified (fixed by base bump / dep upgrade, or explicitly re-accepted).
# Keep entries short-lived; prefer a real fix over an exception.

vulnerabilities: []
