services:
  # v3.7.1
  loki:
    image: grafana/loki:3.7.1@sha256:73e905b51a7f917f7a1075e4be68759df30226e03dcb3cd2213b989cc0dc8eb4
    container_name: loki
    shm_size: "512m"
    ports:
      - "3101:3100"
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki.yml:/etc/loki/loki.yml:ro
      - ./loki-data:/loki
    networks:
      - obs-network
    restart: unless-stopped

  # v13.0.1
  grafana:
    image: grafana/grafana:13.0.1@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - HOSTNAME=${HOSTNAME}
    volumes:
      # Intentional to save Grafana data (dashboards, datasources, etc.) across container restarts. This allows you to persist your Grafana configuration and data even if the container is recreated or updated.
      - ./grafana-data:/var/lib/grafana
    networks:
      - obs-network
    restart: unless-stopped

  # v2.6.0
  tempo:
    image: grafana/tempo:2.6.0@sha256:f55a8a1937fff0af3a760d376b476c8327fb30e432d5e7630d7938b67691e822
    container_name: tempo
    command:
      - --config.file=/etc/tempo/tempo.yml

    volumes:
      - ./config/tempo.yml:/etc/tempo/tempo.yml:ro
      - ./tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - obs-network
    restart: unless-stopped

  # v3.11.3
  prometheus:
    image: prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6d
      - --web.enable-remote-write-receiver
      - --storage.tsdb.max-block-duration=3h
      - --web.enable-otlp-receiver

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-data:/prometheus
      - ./config/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    networks:
      - obs-network
    restart: unless-stopped

  # v1.16.1
  alloy:
    image: grafana/alloy:v1.16.1@sha256:51aeb9d829239345070619dad3edd6873186f913c84f45b365b74574fcb38ec0
    container_name: alloy
    # If running windows, you may need to adjust the user/group IDs or run without user restrictions
    # user: "10001:10001"
    # group_add:
    #   - "1001"
    environment:
      - ALLOY_DEPLOY_MODE=docker
      - HOSTNAME=${HOSTNAME}
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy-data
      # --stability.level=experimental # Enable experimental features for development, disable in production.
      - /etc/alloy/config.alloy

    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/var/log:ro
      - ./alloy-data:/var/lib/alloy-data
    networks:
      - obs-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    container_name: alertmanager
    ports:
      - "9093:9093"
    environment:
      - ALERTMANAGER_SLACK_WEBHOOK=${ALERTMANAGER_SLACK_WEBHOOK}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo -n "$ALERTMANAGER_SLACK_WEBHOOK" > /tmp/slack_webhook.txt
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    # Linux: host-gateway resolves automatically, no extra_hosts needed (kept for macOS/Windows compat)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager-data:/alertmanager
    networks:
      - obs-network
    restart: unless-stopped

networks:
  obs-network:
    external: true
